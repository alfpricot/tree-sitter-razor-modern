# =============================================================================
#  tree-sitter-razor-modern · GitHub Actions
# -----------------------------------------------------------------------------
#  File                gala-release.yml
#  Workflow name       Gala release
#  Type                Entrypoint (runs in this repo only)
#  Triggers            push (main branch)
#                      workflow_dispatch
#  Purpose             Cuts the release when a promotion lands on main. gala
#                      reads the Conventional Commits since the last v* tag,
#                      bumps the Cargo.toml version, writes CHANGELOG.md,
#                      commits (the commit body carries a skip-ci marker),
#                      tags the release commit, pushes main and the tag
#                      atomically, and fast-forwards dev to the release
#                      commit. publish and githubRelease are off in
#                      .gala.toml: release.yml does the crates.io, npm, and
#                      GitHub Release steps.
#
#                      The pushes go over the RELEASE_DEPLOY_KEY deploy key,
#                      because this repo's rulesets block direct pushes to
#                      main and dev and the creation of v* tags, and a deploy
#                      key is the bypass actor available to a workflow on a
#                      personal-account repository. Package versions
#                      (package.json, tree-sitter.json) are not touched here;
#                      release.yml sets them from the tag at publish time.
#
#                      The skip-ci marker in the release commit may also
#                      suppress release.yml's push: tags trigger, so when this
#                      run produced a release, it dispatches release.yml
#                      itself with the new tag. Dispatching on the tag ref
#                      keeps release.yml's provenance check (it requires the
#                      run ref to be the tag). release.yml's publish steps are
#                      safe to repeat, so a duplicate trigger is harmless.
#                      Running this workflow again while HEAD is still a
#                      release commit re-dispatches the publish.
# =============================================================================

name: Gala release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gala-release
  cancel-in-progress: false

env:
  GALA_VERSION: 'v0.2.0'

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout (gala reads tags and history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # origin becomes an SSH remote authenticated by the deploy key, so
          # gala's atomic push and dev sync use the ruleset bypass.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Configure git identity
        # gala makes the release commit with the runner's git; without an
        # identity git refuses to commit at all.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install Rust toolchain
        # gala's cargo manager runs cargo to write the version.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0

      - name: Install gala
        run: |
          go install "github.com/alfpricot/gala/cmd/gala@${GALA_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gala release

      - name: Dispatch the publish workflow for a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a run that produced (or sits on) a release commit has a tag
          # on HEAD; a promotion that releases nothing leaves none.
          tag=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No release tag on HEAD — nothing to publish."
            exit 0
          fi
          gh workflow run release.yml --ref "$tag" -f "tag=${tag}"
